services:
  postgres:
    image: postgres:18
    container_name: workbox-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=workbox
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  workbox-api:
    build: ./workbox-api
    container_name: workbox-api
    restart: unless-stopped
    environment:
      - PROFILE_ACTIVE=${SPRING_PROFILE:-dev}
      - PORT=8080
      - DATABASE_URL=jdbc:postgresql://${DB_HOST:-postgres}:5432/workbox
      - POSTGRES_USER=workbox_service
      - POSTGRES_PASSWORD=workbox_service
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "${WORKBOX_API_PORT:-8080}:8080"
    volumes:
      - workbox_api_avatars:/app/uploads/avatars
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  budget-service:
    build: ./budget-service
    container_name: budget-service
    restart: unless-stopped
    environment:
      - PROFILE_ACTIVE=${SPRING_PROFILE:-dev}
      - PORT=8081
      - DATABASE_URL=jdbc:postgresql://${DB_HOST:-postgres}:5432/workbox
      - POSTGRES_USER=budget_service
      - POSTGRES_PASSWORD=budget_service
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "${BUDGET_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  workbox-app:
    build: ./workbox-app
    container_name: workbox-app
    restart: unless-stopped
    environment:
      - WORKBOX_API_UPSTREAM=http://workbox-api:8080
    ports:
      - "${FRONT_PORT:-5173}:8080"
    depends_on:
      workbox-api:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

volumes:
  workbox_api_avatars:
