services:
  postgres:
    image: postgres:18
    container_name: workbox-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=workbox
    ports:
      - "5433:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d
