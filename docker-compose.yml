services:
  postgres:
    image: postgres:18
    container_name: workbox-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=workbox
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  workbox-api:
    build: ./workbox-api
    container_name: workbox-api
    restart: unless-stopped
    environment:
      - PROFILE_ACTIVE=${SPRING_PROFILE:-dev}
      - PORT=8080
      - DATABASE_URL=jdbc:postgresql://${DB_HOST:-postgres}:5432/workbox
      - POSTGRES_USER=workbox_service
      - POSTGRES_PASSWORD=workbox_service
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_HOST=${MAIL_HOST:-localhost}
      - MAIL_PORT=${MAIL_PORT:-25}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-no-reply@workbox.local}
    ports:
      - "${WORKBOX_API_PORT:-8080}:8080"
    volumes:
      - workbox_api_avatars:/app/uploads/avatars
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  budget-service:
    build: ./budget-service
    container_name: budget-service
    restart: unless-stopped
    environment:
      - PROFILE_ACTIVE=${SPRING_PROFILE:-dev}
      - PORT=8081
      - DATABASE_URL=jdbc:postgresql://${DB_HOST:-postgres}:5432/workbox
      - POSTGRES_USER=budget_service
      - POSTGRES_PASSWORD=budget_service
      - INTROSPECTION_URI=http://workbox-api:8080/api/v1/auth/introspect
      # Client credentials pro budget-service se autenticar em /api/v1/auth/introspect —
      # tem que bater com uma linha ativa em workbox-api.api_clients (ver changelog
      # 260906_0000_create_table_api_clients.sql; a seed padrão já usa esses defaults).
      - INTROSPECTION_CLIENT_ID=${INTROSPECTION_CLIENT_ID:-budget-service}
      - INTROSPECTION_CLIENT_SECRET=${INTROSPECTION_CLIENT_SECRET:-MyS3cur3Cli3ntS3cr3t!Budg3t!}
    ports:
      - "${BUDGET_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  workbox-app:
    build: ./workbox-app
    container_name: workbox-app
    restart: unless-stopped
    environment:
      - WORKBOX_API_UPSTREAM=http://workbox-api:8080
    ports:
      - "${FRONT_PORT:-5173}:8080"
    depends_on:
      workbox-api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, não localhost - a imagem alpine resolve localhost pra ::1 primeiro e
      # o nginx só escuta em IPv4 (listen 8080, sem [::]:8080), então wget contra
      # localhost falha com "connection refused" mesmo com o processo de pé.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

volumes:
  workbox_api_avatars:
