services:
  postgres:
    image: postgres:18
    container_name: workbox-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=workbox
    ports:
      - "${POSTGRES_PORT:-7050}:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  # Sem volume de propósito — só guarda refresh tokens (TTL nativo, dado efêmero por
  # natureza). Perder o conteúdo num restart só força um re-login, nunca perda de dado
  # real (ver workbox-api/README.md#refresh-tokens-redis).
  redis:
    image: redis:7-alpine
    container_name: workbox-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-MyS3cur3R3disP@ssw0rd2026!}"]
    ports:
      - "${REDIS_PORT:-7056}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-MyS3cur3R3disP@ssw0rd2026!}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  workbox-api:
    build: ./workbox-api
    container_name: workbox-api
    restart: unless-stopped
    environment:
      - PROFILE_ACTIVE=${SPRING_PROFILE:-dev}
      - PORT=8080
      - DATABASE_URL=jdbc:postgresql://${DB_HOST:-postgres}:5432/workbox
      - POSTGRES_USER=workbox_service
      - POSTGRES_PASSWORD=workbox_service
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_HOST=${MAIL_HOST:-localhost}
      - MAIL_PORT=${MAIL_PORT:-25}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-no-reply@workbox.local}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-MyS3cur3R3disP@ssw0rd2026!}
    ports:
      - "${WORKBOX_API_PORT:-7051}:8080"
    volumes:
      - workbox_api_avatars:/app/uploads/avatars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  budget-service:
    build: ./budget-service
    container_name: budget-service
    restart: unless-stopped
    environment:
      - PROFILE_ACTIVE=${SPRING_PROFILE:-dev}
      - PORT=8081
      - DATABASE_URL=jdbc:postgresql://${DB_HOST:-postgres}:5432/workbox
      - POSTGRES_USER=budget_service
      - POSTGRES_PASSWORD=budget_service
      - INTROSPECTION_URI=http://workbox-api:8080/api/v1/auth/introspect
      # Client credentials pro budget-service se autenticar em /api/v1/auth/introspect —
      # tem que bater com uma linha ativa em workbox-api.api_clients (ver changelog
      # 260906_0000_create_table_api_clients.sql; a seed padrão já usa esses defaults).
      - INTROSPECTION_CLIENT_ID=${INTROSPECTION_CLIENT_ID:-budget-service}
      - INTROSPECTION_CLIENT_SECRET=${INTROSPECTION_CLIENT_SECRET:-MyS3cur3Cli3ntS3cr3t!Budg3t!}
    ports:
      - "${BUDGET_SERVICE_PORT:-7052}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  mongo:
    # mongo:8 se recusa a iniciar neste kernel (SERVER-121912 — checagem de
    # compatibilidade de kernel >= 6.19 falha em builds mais novos que a MongoDB ainda
    # não validou); mongo:7 sobe normalmente e é suportado até 2026+.
    image: mongo:7
    container_name: workbox-mongo
    restart: always
    ports:
      - "${MONGO_PORT:-7054}:27017"
    volumes:
      - ./.mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  notes-service:
    build: ./notes-service
    container_name: notes-service
    restart: unless-stopped
    environment:
      - PROFILE_ACTIVE=${SPRING_PROFILE:-dev}
      - PORT=8082
      - MONGODB_URI=mongodb://${MONGO_HOST:-mongo}:27017/notes
      - INTROSPECTION_URI=http://workbox-api:8080/api/v1/auth/introspect
      # Client credentials pro notes-service se autenticar em /api/v1/auth/introspect —
      # tem que bater com uma linha ativa em workbox-api.api_clients (ver changelog
      # 260916_0000_seed_api_clients_notes_service.sql; a seed padrão já usa esses defaults).
      - INTROSPECTION_CLIENT_ID=${NOTES_INTROSPECTION_CLIENT_ID:-notes-service}
      - INTROSPECTION_CLIENT_SECRET=${NOTES_INTROSPECTION_CLIENT_SECRET:-MyS3cur3Cli3ntS3cr3t!N0tes!}
    ports:
      - "${NOTES_SERVICE_PORT:-7055}:8082"
    depends_on:
      mongo:
        condition: service_healthy
      workbox-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  workbox-app:
    build: ./workbox-app
    container_name: workbox-app
    restart: unless-stopped
    environment:
      - WORKBOX_API_UPSTREAM=http://workbox-api:8080
      - BUDGET_SERVICE_UPSTREAM=http://budget-service:8081
    ports:
      - "${FRONT_PORT:-7053}:8080"
    depends_on:
      workbox-api:
        condition: service_healthy
      budget-service:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, não localhost - a imagem alpine resolve localhost pra ::1 primeiro e
      # o nginx só escuta em IPv4 (listen 8080, sem [::]:8080), então wget contra
      # localhost falha com "connection refused" mesmo com o processo de pé.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  # Backup/restore manual do Postgres (pg_dump/pg_restore --format=custom, todos os
  # schemas). profiles: ["backup"] - nunca sobem com "docker compose up" normal, só
  # via "docker compose --profile backup run --rm backup|restore" (ver README).
  backup:
    image: postgres:18
    container_name: workbox-backup
    profiles: ["backup"]
    environment:
      - PGHOST=${DB_HOST:-postgres}
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=workbox
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/scripts/backup-db.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  restore:
    image: postgres:18
    container_name: workbox-restore
    profiles: ["backup"]
    environment:
      - PGHOST=${DB_HOST:-postgres}
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=workbox
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/scripts/restore-db.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  workbox_api_avatars:
